<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Result &middot; Intelligent Document Extraction</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div>
        <h1 id="doc-title">Document Result</h1>
        <p id="doc-subtitle">&nbsp;</p>
      </div>
      <span id="status-pill" class="health-pill">loading&hellip;</span>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="/">&larr; Back to dashboard</a>

    <div id="load-error" class="card" style="display:none;"></div>

    <div id="result-content" style="display:none;">
      <section class="card">
        <h2 data-icon="file">Document Summary</h2>
        <div class="summary-grid" id="summary-grid"></div>
      </section>

      <section class="card">
        <h2 data-icon="shield">File Validation</h2>
        <div class="summary-grid" id="file-validation-grid"></div>
      </section>

      <section class="card">
        <h2 data-icon="data">Extracted Information</h2>
        <div id="extracted-fields" class="field-grid"></div>
        <div id="financial-tables"></div>
        <div id="line-items-section"></div>
      </section>

      <section class="card">
        <h2 data-icon="check">Financial Validation</h2>
        <div id="validation-summary"></div>
        <div class="table-scroll">
          <table id="validation-table">
            <thead>
              <tr><th>Check</th><th>Formula</th><th>Period</th><th>Calculated</th><th>Reported</th><th>Variance</th><th>Status</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="issues-box"></div>
      </section>

      <section class="card">
        <h2>Raw JSON</h2>
        <button class="secondary" id="copy-json-btn">Copy JSON</button>
        <pre class="json-viewer" id="json-viewer"></pre>
      </section>
    </div>
  </main>

  <script>
    window.API_BASE_URL = "{{ backend_url }}/api/v1";
    window.DOCUMENT_NAME = {{ document_name | tojson }};
  </script>
  <script src="/static/js/document.js"></script>
</body>
</html>
